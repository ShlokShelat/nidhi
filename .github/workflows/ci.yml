name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-cpu.txt
      - run: pip install -r requirements-cpu.txt
      - run: python -m pytest -q tests
      - name: Every module compiles
        run: python -m compileall -q src tools
      - name: No post text is committed
        run: |
          for f in data/test.csv artifacts/full_train.csv submissions/NIDHI_scaled.csv; do
            if [ -e "$f" ]; then echo "::error::$f must not be committed"; exit 1; fi
          done
